name: Build app-only (lichuang-dev)

# 只编 app-only 固件 xiaozhi.bin，用于 OTA 推送验证。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-app.yml'

permissions:
  contents: read

jobs:
  build-app:
    name: Build lichuang-dev app-only
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build lichuang-dev
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py --version
          python scripts/build.py lckfb/szpi-esp32s3 --name lichuang-dev

      - name: Report firmware size
        shell: bash
        run: |
          set -x
          ls -l build/xiaozhi.bin build/merged-binary.bin build/partition_table/partition-table.bin 2>/dev/null || true
          for f in build/xiaozhi.bin build/merged-binary.bin; do
            if [ -f "$f" ]; then
              sz=$(stat -c %s "$f")
              mib=$(awk -v s="$sz" 'BEGIN{printf "%.2f", s/1048576}')
              echo "SIZE $f = $sz bytes = ${mib} MiB"
            fi
          done
          echo "--- partition table ---"
          python "$IDF_PATH/components/partition_table/gen_esp32part.py" build/partition_table/partition-table.bin || true
          echo "--- app size limit from sdkconfig ---"
          grep -E "^CONFIG_PARTITION_TABLE_(CUSTOM|FILENAME)|^CONFIG_ESPTOOLPY_FLASHSIZE" sdkconfig || true

      - name: Upload app-only firmware
        uses: actions/upload-artifact@v7
        with:
          name: xiaozhi-lichuang-app-only
          path: |
            build/xiaozhi.bin
            build/merged-binary.bin
          if-no-files-found: error
          retention-days: 7
