name: Build app-only (lichuang-dev)

# 只编 app-only 固件 xiaozhi.bin，用于 OTA 推送验证。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'PROJECT_VER, e.g. 2.5.3 or 2.6.0'
        required: true
        default: '2.5.3'
      ota_url:
        description: 'Default CONFIG_OTA_URL'
        required: true
        default: 'http://192.168.8.117:8003/xiaozhi/ota/'

permissions:
  contents: read

jobs:
  build-app:
    name: Build lichuang-dev app-only
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply build-time config
        shell: bash
        run: |
          set -e
          VER="${{ inputs.version }}"
          OTA="${{ inputs.ota_url }}"
          sed -i -E "s|^set\(PROJECT_VER .*\)|set(PROJECT_VER \"${VER}\")|" CMakeLists.txt
          sed -i -E "s|^    default \"https://api.tenclass.net/xiaozhi/ota/\"|    default \"${OTA}\"|" main/Kconfig.projbuild
          echo "--- PROJECT_VER ---"
          grep -n "PROJECT_VER" CMakeLists.txt | head -3
          echo "--- CONFIG_OTA_URL default ---"
          grep -n -A3 "config OTA_URL" main/Kconfig.projbuild | head -6

      - name: Build lichuang-dev
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py --version
          python scripts/build.py lckfb/szpi-esp32s3 --name lichuang-dev --language zh-CN

      - name: Report sizes
        shell: bash
        run: |
          set -x
          ls -l build/xiaozhi.bin build/merged-binary.bin

      - name: Upload app-only firmware
        uses: actions/upload-artifact@v7
        with:
          name: xiaozhi-lichuang-app-only-${{ inputs.version }}
          path: |
            build/xiaozhi.bin
            build/merged-binary.bin
          if-no-files-found: error
          retention-days: 7
